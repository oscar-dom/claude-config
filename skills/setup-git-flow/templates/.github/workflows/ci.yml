name: CI

# Stack-agnostic on purpose: this workflow makes no assumptions about the
# language, package manager or tooling the project will use. It only enforces
# the Git workflow, which applies to any repository. Add build, lint and test
# jobs here once the project has a stack, and list their job `name:` values as
# required status checks in the branch rulesets.
#
# The job `name:` below ("Commit messages") is the `context` required by the
# rulesets. Renaming it without updating the rulesets blocks every pull request,
# because a required check that never reports keeps the PR waiting forever.

on:
  pull_request:
    branches: [main, develop]
    # `edited` re-runs the checks when the PR title or description changes:
    # the title becomes the commit message, so fixing it must re-validate.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commit-lint:
    name: Commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Title and body go through env vars, never interpolated into a script,
      # so their content cannot inject shell code.
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      # Conventional Commits, as documented in CONTRIBUTING.md:
      # <type>[(scope)][!]: <description>, no trailing period. The description
      # must not start like a sentence ("Add ..."), but may start with an
      # acronym or a name in capitals ("README", "API", "CI").
      CC_PATTERN: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: ([^A-Z[:space:]]|[A-Z][A-Z0-9])(.*[^.[:space:]])?$'
      # Same limit as commitlint's default: long enough for Dependabot titles
      # such as "ci: bump <owner>/<action>/<path> from X to Y in the actions group".
      CC_MAX_LENGTH: 100
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The steps below only read local history: do not leave the token in
          # .git/config for the rest of the job.
          persist-credentials: false

      # Only develop, hotfix/* and release/* may be merged into main. A feature
      # branch merged straight into main skips the integration branch.
      - name: Check source branch
        if: github.base_ref == 'main'
        run: |
          case "$HEAD_REF" in
            develop|hotfix/*|release/*)
              echo "Source branch '$HEAD_REF' may target main." ;;
            *)
              echo "::error::Only develop, hotfix/* or release/* can be merged into main (got '$HEAD_REF')."
              echo "Open the pull request against develop instead."
              exit 1 ;;
          esac

      # The PR title is the commit message that lands on the base branch: squash
      # merges into develop and merge commits into main both use it.
      - name: Validate PR title
        run: |
          # GitHub's "Revert" button titles the PR 'Revert "<original title>"'.
          # The original title was already validated, so the revert is accepted.
          case "$PR_TITLE" in
            'Revert "'*'"')
              echo "PR title OK (revert created by GitHub): $PR_TITLE"
              exit 0 ;;
          esac
          if ! printf '%s' "$PR_TITLE" | grep -qE "$CC_PATTERN"; then
            echo "::error::PR title is not a Conventional Commit: $PR_TITLE"
            echo "Expected: <type>[(scope)]: <description> — no capitalized first word, no trailing period."
            echo "Types: build chore ci docs feat fix perf refactor revert style test"
            exit 1
          fi
          if [ "${#PR_TITLE}" -gt "$CC_MAX_LENGTH" ]; then
            echo "::error::PR title is ${#PR_TITLE} characters long (max $CC_MAX_LENGTH)."
            exit 1
          fi
          echo "PR title OK: $PR_TITLE"

      # Into main, commits land as they are (merge commit, no squash), so each
      # one must follow the convention too. Into develop they are squashed away
      # and only the PR title survives, so they are not checked there.
      - name: Validate commit messages
        if: github.base_ref == 'main'
        run: |
          found=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in 'Revert "'*) continue ;; esac
            # Squash commits get " (#123)" appended by GitHub: not part of the title.
            subject=$(printf '%s' "$subject" | sed -E 's/ \(#[0-9]+\)$//')
            if ! printf '%s' "$subject" | grep -qE "$CC_PATTERN" || [ "${#subject}" -gt "$CC_MAX_LENGTH" ]; then
              echo "::error::Commit ${sha:0:7} is not a valid Conventional Commit: $subject"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo "Reword the commits (git rebase -i, then git push --force-with-lease)."
            exit 1
          fi
          echo "All commits follow Conventional Commits."

      # AI tools must not leave their mark as collaborators (see CONTRIBUTING.md).
      # Checks every commit in the PR (message, author and committer) and the PR
      # title and description, whatever the target branch.
      - name: Reject AI attribution
        run: |
          # Match AI identities, not human names: "Claude" alone is also a person's
          # name, so a co-author only counts when it carries an AI email or model.
          ai_id='noreply@anthropic\.com|@anthropic\.com>|claude (code|opus|sonnet|haiku|fable)|copilot|openai\.com|chatgpt|gemini|cursor ?agent|codex'
          ai_tool='claude|anthropic|copilot|openai|chatgpt|gemini|cursor|codex|aider'
          # Only attribution lines count: a commit that merely mentions a tool
          # ("feat: add gemini client") is fine.
          pattern="co-authored-by:.*(${ai_id})|generated (with|by) .*(${ai_tool})"
          found=0

          bad=$(git log --format='%h %an <%ae> / %cn <%ce>' "$BASE_SHA..$HEAD_SHA" | grep -iE "$ai_id" || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits authored or committed by an AI tool:"
            echo "$bad"
            found=1
          fi

          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            hits=$(git log -1 --format=%B "$sha" | grep -inE "$pattern" || true)
            if [ -n "$hits" ]; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") contains AI attribution:"
              echo "$hits"
              found=1
            fi
          done

          hits=$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -inE "$pattern" || true)
          if [ -n "$hits" ]; then
            echo "::error::The PR title or description contains AI attribution:"
            echo "$hits"
            found=1
          fi

          if [ "$found" -ne 0 ]; then
            echo "Remove the attribution (git commit --amend / git rebase -i, then"
            echo "git push --force-with-lease; edit the PR description) and push again."
            exit 1
          fi
          echo "No AI attribution found."
