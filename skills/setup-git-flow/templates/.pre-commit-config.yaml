# Base pre-commit config: language-agnostic hooks only.
#
# Everything here works in any repo — Python, JS/TS, Go, or a repo with no code
# at all — so it can be installed at setup time without knowing the stack.
# Stack-specific hooks (ruff, mypy, commitlint) get APPENDED to this file later;
# see the "stack-specific hooks" step in SKILL.md. Never replace this file with a
# stack-specific one: that drops the secret scanning below.
#
# Pinned revs, not floating refs. Refresh with: pre-commit autoupdate

repos:
  # ---------------------------------------------------------------------------
  # Secret scanning — scans CONTENT, which .gitignore cannot do.
  # .gitignore excludes by filename; this catches a key hardcoded inside a
  # source file that no filename pattern would ever match.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      # Builds gitleaks from source, so it needs a Go toolchain available to
      # pre-commit. If that is a problem, swap the id for `gitleaks-system`
      # (uses an already-installed gitleaks binary) or `gitleaks-docker`.
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # Hygiene — cheap, universal, no language assumptions.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict   # catches <<<<<<< left in a resolved file
      - id: check-case-conflict    # names that collide on Windows/macOS
      - id: check-added-large-files  # default limit 500kB
