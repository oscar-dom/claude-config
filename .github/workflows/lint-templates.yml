name: Lint templates

# Checks what the skills ship and this repository never runs itself: the workflow
# templates copied into users' projects and the scripts that talk to GitHub.
# Without it they would only be tested once a skill had already set up a real
# project.
#
# Every pull request: one lint job and the script tests on Linux and Windows.
# macOS runs weekly and on demand: its hosted runners queue for long stretches,
# and a queued-then-cancelled job would fail every pull request for no reason.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 6 * * 1"   # Mondays, for macOS
  workflow_dispatch:       # run by hand, e.g. before publishing

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint --version

      # A broken template would break the CI of every project the skill sets up.
      - name: Lint skill workflow templates
        run: |
          mapfile -t files < <(
            find skills -path '*/templates/.github/workflows/*' \
              \( -name '*.yml' -o -name '*.yaml' \) | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No workflow templates found — did the layout change?"
            exit 1
          fi
          printf 'Linting %d template(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          ./actionlint -color "${files[@]}"

      - name: Lint this repo's own workflows
        run: ./actionlint -color

      # actionlint checks the syntax of a `uses:` line but never resolves it.
      - name: Every `uses:` ref exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-action-refs.sh

      # The commit convention and the required check's name live in lib.sh, the
      # CI template and the rulesets; if they disagree, the agent ships titles the
      # CI rejects or waits for a check that never reports.
      - name: Commit convention in sync
        run: bash scripts/check-convention-sync.sh

  script-tests:
    name: Script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows (Git Bash, as on a user's Windows machine) on every
        # change; macOS (BSD sed/grep/awk, bash 3.2) only weekly or by hand.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ship.sh, release.sh, hotfix.sh and friends against a local remote and a
      # fake gh (tests/fake-gh.sh): their logic, without touching GitHub.
      - name: Run the setup-git-flow script tests
        run: bash tests/test-setup-git-flow.sh
